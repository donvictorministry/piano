<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f5">

  <!-- Open Graph — WhatsApp & Facebook link preview -->
  <meta property="og:type"         content="website">
  <meta property="og:site_name"    content="PianoBar">
  <meta property="og:title"        content="PianoBar">
  <meta property="og:description"  content="Mobile piano player with built-in melodies. Tap to play.">
  <meta property="og:image"        content="https://YOUR_HOSTED_ICON_URL/icon-512.png">
  <meta property="og:image:width"  content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:url"          content="https://YOUR_USERNAME.github.io/pianobar/">

  <title>PianoBar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Lock Screen -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <h2>PianoBar</h2>
      <p>Enter PIN to continue</p>
      <input type="password" id="pin-input" maxlength="4"
             placeholder="••••" inputmode="numeric" autocomplete="off">
      <button id="pin-submit">Unlock</button>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">

    <header class="app-header">
      <span class="app-title">PianoBar</span>
      <button id="dark-toggle" class="icon-btn" aria-label="Toggle dark mode">
        <!-- SVG injected by app.js -->
      </button>
    </header>

    <section class="song-section">
      <div class="input-row">
        <input type="text" id="song-input"
               placeholder="Search a melody…" autocomplete="off">
        <button id="search-btn">Search</button>
      </div>

      <div id="now-playing" class="now-playing hidden">
        <span id="song-title"></span>
        <div class="play-controls">
          <button id="play-btn" class="ctrl-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <polygon points="5,3 19,12 5,21" fill="currentColor"/>
            </svg>
            Play
          </button>
          <button id="stop-btn" class="ctrl-btn stop hidden">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" fill="currentColor"/>
            </svg>
            Stop
          </button>
        </div>
      </div>

      <div class="speed-row">
        <span>Speed</span>
        <input type="range" id="speed-range"
               min="0.5" max="2" step="0.25" value="1.25">
        <span id="speed-label">1.25×</span>
      </div>
    </section>

    <section class="chips-section">
      <div id="chips" class="chips"></div>
    </section>

    <section class="piano-section">
      <div class="piano-scroll">
        <div id="piano" class="piano"></div>
      </div>
    </section>

    <p class="hint">Tap keys to play · Scroll to see all notes</p>
  </div>

  <!-- Global centred toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="melody.js"></script>
  <script src="lock.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
